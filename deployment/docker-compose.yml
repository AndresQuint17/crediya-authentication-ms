services:
  auth-postgresql:
    image: postgres:17.4-alpine3.21
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgresql_reto-pragma-data:/var/lib/postgresql/data/
    networks:
      - auth-net

  authentication:
    image: authentication-ms:latest
    ports:
      - "8080:8080"
    environment:
      ADAPTERS_R2DBC_HOST: auth-postgresql
      ADAPTERS_R2DBC_PORT: 5432
      ADAPTERS_R2DBC_DATABASE: ${ADAPTERS_R2DBC_DATABASE}
      ADAPTERS_R2DBC_SCHEMA: ${ADAPTERS_R2DBC_SCHEMA}
      ADAPTERS_R2DBC_USERNAME: ${ADAPTERS_R2DBC_USERNAME}
      ADAPTERS_R2DBC_PASSWORD: ${ADAPTERS_R2DBC_PASSWORD}
      AUTHENTICATION_JWT_SECRET_KEY: ${AUTHENTICATION_JWT_SECRET_KEY}
      AUTHENTICATION_JWT_TIMEOUT: ${AUTHENTICATION_JWT_TIMEOUT}
    networks:
      - auth-net

networks:
  auth-net:
    name: auth-net
