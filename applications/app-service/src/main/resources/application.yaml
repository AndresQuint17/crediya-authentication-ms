server:
  port: 8080
spring:
  application:
    name: "AuthenticationMS"
  devtools:
    add-properties: false
  webflux:
    validator:
      enabled: true
  h2:
    console:
      enabled: true
      path: "/h2"
jwt:
  json-exp-roles: "/roles"
  secret: ${AUTHENTICATION_JWT_SECRET_KEY}
  expiration: ${AUTHENTICATION_JWT_TIMEOUT:86400000}
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
adapters:
  r2dbc:
    host: ${ADAPTERS_R2DBC_HOST}
    port: ${ADAPTERS_R2DBC_PORT}
    database: ${ADAPTERS_R2DBC_DATABASE}
    schema: ${ADAPTERS_R2DBC_SCHEMA}
    username: ${ADAPTERS_R2DBC_USERNAME}
    password: ${ADAPTERS_R2DBC_PASSWORD}
logging:
  level:
    org.springframework.security: DEBUG
  file:
    name: logs/application.log
